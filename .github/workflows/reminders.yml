name: Recordatorios WhatsApp

on:
  schedule:
    - cron: '30 12 * * 1-6'  # 9:30 AM Argentina (UTC-3), Lunes a Sábado
  workflow_dispatch:          # permite ejecutarlo manualmente para probar

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        working-directory: ./whatsapp-bot
        run: npm install

      - name: Enviar recordatorios
        working-directory: ./whatsapp-bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          REPO_WA:      ${{ secrets.REPO_WA }}
        run: node send-reminders.js
