name: Desplegar sitio web

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar archivos del sitio
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TOKEN_WA: ${{ secrets.TOKEN_WA }}
          REPO_WA: ${{ secrets.REPO_WA }}
        run: |
          mkdir _site
          cp *.html *.css *.avif _site/ 2>/dev/null || true
          cp script.js cancel.js mis-turnos.js client-config.json _site/
          node -e "
            const fs = require('fs');
            let c = fs.readFileSync('supabase-config.js', 'utf8');
            c = c.replace('__SUPABASE_URL__', process.env.SUPABASE_URL);
            c = c.replace('__SUPABASE_KEY__', process.env.SUPABASE_KEY);
            fs.writeFileSync('_site/supabase-config.js', c);
            let a = fs.readFileSync('admin.html', 'utf8');
            a = a.replace('__GITHUB_TOKEN__', process.env.TOKEN_WA);
            a = a.replace('__GITHUB_REPO__', process.env.REPO_WA);
            fs.writeFileSync('_site/admin.html', a);
          "

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Subir archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
