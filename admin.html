<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Barber Shop</title>
    <link rel="stylesheet" href="styles.css?v=20260308-1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js?v=fix-cb-001"></script>
    
    <style>
        /* Ajustes específicos para Admin */
        .admin-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 20px; }
        .admin-tab-btn { background: transparent; border: 1px solid #444; color: #888; padding: 10px; cursor: pointer; font-size: 12px; min-width: 0; }
        .admin-tab-btn.active { background: #222; color: white; border-bottom: 2px solid var(--accent-blue); }
        .admin-list-item { background: #111; border: 1px solid #333; padding: 15px; margin-bottom: 10px; border-radius: 8px; font-size: 14px; }
        .admin-input { background: #222; border: 1px solid #444; color: white; padding: 8px; width: 100%; border-radius: 4px; margin-bottom: 10px; }
        .delete-btn { background: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .dashboard-filters { background: #111; border: 1px solid #333; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .dashboard-date-label { font-size: 12px; color: #aaa; margin-bottom: 6px; display: block; }
        .barber-day-card { background: #111; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
        .barber-day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #2b2b2b; padding-bottom: 8px; }
        .barber-day-name { font-weight: bold; color: var(--accent-blue); }
        .barber-day-count { font-size: 12px; color: #999; }
        .dashboard-booking-row { background: #1a1a1a; border: 1px solid #2f2f2f; border-radius: 6px; padding: 10px; margin-bottom: 8px; }
        .dashboard-booking-row:last-child { margin-bottom: 0; }
        .dashboard-booking-row.done { opacity: 0.75; border-color: #1f7a46; }
        .done-badge { display: inline-block; font-size: 11px; font-weight: bold; color: #86efac; background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.45); border-radius: 999px; padding: 2px 8px; }
        .complete-btn { background: #22c55e; color: #04130a; border: none; padding: 8px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; }
        .complete-btn:disabled { background: #2d3748; color: #94a3b8; cursor: default; }
        .report-summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .report-card { background: #111; border: 1px solid #333; border-radius: 8px; padding: 12px; }
        .report-card-title { color: #9ca3af; font-size: 12px; margin-bottom: 6px; }
        .report-card-value { font-size: 20px; font-weight: bold; }
        .report-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #111; border: 1px solid #333; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
        .report-date { font-weight: bold; color: #ddd; }
        .report-meta { font-size: 12px; color: #aaa; margin-top: 2px; }
        .report-money { color: #22c55e; font-weight: bold; }
        .report-section-title { margin: 14px 0 8px; font-size: 12px; color: #a3a3a3; letter-spacing: .4px; text-transform: uppercase; }
        .cancel-badge { display: inline-block; font-size: 11px; font-weight: bold; color: #fecaca; background: rgba(239, 68, 68, 0.16); border: 1px solid rgba(239, 68, 68, 0.45); border-radius: 999px; padding: 2px 8px; }
        #screen-login {
            align-items: center;
            text-align: center;
            padding-top: 0;
        }
        #screen-login .main-title {
            margin-bottom: 6px;
        }
        #screen-login .divider {
            margin: 12px auto;
        }
        .admin-icon-btn { cursor: pointer; }
        .settings-panel {
            display: none;
            background: #111;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .settings-panel.visible { display: block; }
        .settings-panel-title { font-size: 13px; color: #ddd; margin-bottom: 10px; font-weight: bold; }
        .settings-panel-row { display: flex; gap: 8px; }
        .settings-panel-note { font-size: 11px; color: #888; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="corner-decoration corner-tl"></div>
        <div class="corner-decoration corner-tr"></div>
        <div class="corner-decoration corner-bl"></div>
        <div class="corner-decoration corner-br"></div>

        <div class="screen-content">
            
            <!-- PANTALLA LOGIN -->
            <div id="screen-login" class="screen active home-screen" style="justify-content: center;">
                <h1 class="main-title" style="font-size: 24px;">ADMIN PANEL</h1>
                <div class="divider"><i class="fa-solid fa-lock"></i></div>
                <div style="width: 80%; margin: 20px auto;">
                    <input type="password" id="password" class="admin-input" placeholder="Contraseña" style="text-align: center; font-size: 18px;">
                    <button class="btn btn-primary" onclick="checkLogin()">INGRESAR</button>
                    <p id="login-error" style="color: red; font-size: 12px; display: none; margin-top: 10px;">Contraseña incorrecta</p>
                </div>
            </div>

            <!-- PANTALLA DASHBOARD -->
            <div id="screen-dashboard" class="screen">
                <div class="header-nav">
                    <i class="fa-solid fa-right-from-bracket" onclick="location.reload()"></i>
                    <div style="font-family: 'Abril Fatface';">ADMIN</div>
                    <i class="fa-solid fa-user-gear admin-icon-btn" onclick="toggleSettingsPanel()"></i>
                </div>

                <div id="admin-settings-panel" class="settings-panel">
                    <div class="settings-panel-title">Ajustes de administrador</div>
                    <input type="password" id="current-admin-pass" class="admin-input" placeholder="Contraseña actual">
                    <input type="password" id="new-admin-pass" class="admin-input" placeholder="Nueva contraseña">
                    <input type="password" id="confirm-admin-pass" class="admin-input" placeholder="Confirmar nueva contraseña">
                    <div class="settings-panel-row">
                        <button class="btn btn-primary" style="padding: 8px; margin: 0; font-size: 12px;" onclick="updateAdminPassword()">GUARDAR</button>
                        <button class="btn btn-secondary" style="padding: 8px; margin: 0; font-size: 12px;" onclick="closeSettingsPanel()">CERRAR</button>
                    </div>
                    <div class="settings-panel-note">Si olvidás la contraseña, se puede resetear desde el código.</div>
                </div>

                <div class="admin-tabs">
                    <button class="admin-tab-btn active" onclick="showTab('reservas')">PRÓXIMAS</button>
                    <button class="admin-tab-btn" onclick="showTab('historial')">HISTORIAL</button>
                    <button class="admin-tab-btn" onclick="showTab('precios')">PRECIOS</button>
                    <button class="admin-tab-btn" onclick="showTab('barberos')">EQUIPO</button>
                    <button class="admin-tab-btn" onclick="showTab('reportes')">REPORTE DIARIO</button>
                    <button class="admin-tab-btn" onclick="showTab('whatsapp'); loadWhatsappStatus();">WHATSAPP</button>
                </div>

                <!-- CONTENIDO: PRÓXIMAS -->
                <div id="tab-reservas" class="tab-content">
                    <div class="dashboard-filters">
                        <label for="dashboard-date" class="dashboard-date-label">Ver agenda por día</label>
                        <input type="date" id="dashboard-date" class="admin-input" style="margin-bottom:0;" onchange="loadBookings()">
                        <label for="dashboard-barber" class="dashboard-date-label" style="margin-top:10px;">Filtrar por barbero</label>
                        <select id="dashboard-barber" class="admin-input" style="margin-bottom:0;" onchange="loadBookings()">
                            <option value="all">Todos los barberos</option>
                        </select>
                    </div>
                    <div id="bookings-dashboard"><p style="text-align: center; color: #666;">Cargando...</p></div>
                </div>

                <!-- CONTENIDO: HISTORIAL -->
                <div id="tab-historial" class="tab-content" style="display: none;">
                    <div id="history-list"><p style="text-align: center; color: #666;">Cargando...</p></div>
                </div>

                <div id="tab-precios" class="tab-content" style="display: none;">
                    <div id="services-list"></div>
                </div>

                <div id="tab-barberos" class="tab-content" style="display: none;">
                    <div class="admin-list-item" style="border-style: dashed;">
                        <input type="text" id="new-barber" class="admin-input" placeholder="Nombre nuevo barbero">
                        <button class="btn btn-primary" style="padding: 5px; font-size: 12px;" onclick="addBarber()">AGREGAR</button>
                    </div>
                    <div id="barbers-list"></div>
                </div>

                <div id="tab-whatsapp" class="tab-content" style="display: none;">
                    <div style="text-align: center; padding: 16px 0;">
                        <div id="wa-status-badge" style="font-size: 15px; margin-bottom: 16px;">Cargando...</div>
                        <div id="wa-qr-container" style="display: none; margin-bottom: 16px;">
                            <p style="font-size: 12px; color: #aaa; margin-bottom: 10px;">Escaneá con WhatsApp → Dispositivos vinculados → Vincular dispositivo</p>
                            <img id="wa-qr-image" src="" alt="QR WhatsApp" style="width: 220px; height: 220px; border: 2px solid #333; border-radius: 8px; background: white;">
                            <p style="font-size: 11px; color: #555; margin-top: 8px;">El QR expira en ~3 minutos</p>
                        </div>
                        <button id="wa-reconnect-btn" class="btn btn-primary" style="padding: 10px;" onclick="reconnectWhatsapp()">VINCULAR / RECONECTAR</button>
                    </div>
                </div>

                <div id="tab-reportes" class="tab-content" style="display: none;">
                    <div id="report-summary" class="report-summary-grid"></div>
                    <div id="report-by-barber-list"></div>
                    <div id="report-cancelled-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let sbClient = null;
        let supabaseInitError = null;
        try {
            sbClient = window.createSupabaseClient();
        } catch (error) {
            supabaseInitError = error;
            console.error("Error inicializando Supabase:", error);
        }

        function requireSupabase() {
            if (!sbClient) {
                throw new Error("Supabase no está configurado correctamente.");
            }
            return sbClient;
        }

        const ADMIN_PASS_DEFAULT = "admin123";
        const ADMIN_PASS_STORAGE_KEY = "barberia_admin_password";

        function getAdminPass() {
            return localStorage.getItem(ADMIN_PASS_STORAGE_KEY) || ADMIN_PASS_DEFAULT;
        }

        function setAdminPass(newPass) {
            localStorage.setItem(ADMIN_PASS_STORAGE_KEY, newPass);
        }

        const DB = {
            async getServices() {
                const { data, error } = await requireSupabase().from("services").select("id,name,price").order("id", { ascending: true });
                if (error) throw error;
                return data || [];
            },
            async updateServicePrice(id, price) {
                const { error } = await requireSupabase().from("services").update({ price: Number(price) }).eq("id", id);
                if (error) throw error;
            },
            async getBarbers() {
                const { data, error } = await requireSupabase().from("barbers").select("id,name,active").order("name", { ascending: true });
                if (error) throw error;
                return data || [];
            },
            async addBarber(name) {
                const { error } = await requireSupabase().from("barbers").insert([{ name, active: true }]);
                if (error) throw error;
            },
            async updateBarber(id, updates) {
                const { error } = await requireSupabase().from("barbers").update(updates).eq("id", id);
                if (error) throw error;
            },
            async deleteBarber(id) {
                const { error } = await requireSupabase().from("barbers").delete().eq("id", id);
                if (error) throw error;
            },
            async getBookings() {
                const { data, error } = await requireSupabase().from("bookings").select("*").order("date", { ascending: true });
                if (error) throw error;
                return data || [];
            },
            async deleteBooking(id) {
                const { error } = await requireSupabase().from("bookings").delete().eq("id", id);
                if (error) throw error;
            },
            async cancelBooking(id) {
                const { error } = await requireSupabase()
                    .from("bookings")
                    .update({ status: "cancelled", cancelled_at: new Date().toISOString(), completed: false })
                    .eq("id", id);
                if (error) throw error;
            },
            async markBookingCompleted(id) {
                const { error } = await requireSupabase()
                    .from("bookings")
                    .update({ completed: true, completed_at: new Date().toISOString() })
                    .eq("id", id);
                if (error) throw error;
            },
            async seedDefaultsIfEmpty() {
                const { data: currentBarbers, error: barbersError } = await requireSupabase()
                    .from("barbers")
                    .select("id")
                    .limit(1);
                if (barbersError) throw barbersError;
                if ((currentBarbers || []).length === 0) {
                    const { error } = await requireSupabase().from("barbers").insert([
                        { name: "Juan Pérez", active: true },
                        { name: "Carlos Top", active: true },
                        { name: "El Maestro", active: true }
                    ]);
                    if (error) throw error;
                }

                const { data: currentServices, error: servicesError } = await requireSupabase()
                    .from("services")
                    .select("id")
                    .limit(1);
                if (servicesError) throw servicesError;
                if ((currentServices || []).length === 0) {
                    const { error } = await requireSupabase().from("services").insert([
                        { name: "Corte Clásico", price: 20 },
                        { name: "Afeitado", price: 15 },
                        { name: "Barba y Corte", price: 30 },
                        { name: "Lavado", price: 10 },
                        { name: "Peinado", price: 12 },
                        { name: "Tratamiento", price: 25 }
                    ]);
                    if (error) throw error;
                }
            }
        };

        let servicesCache = [];
        let barbersCache = [];
        let bookingsCache = [];
        let autoRefreshIntervalId = null;
        let isAutoRefreshing = false;

        function showAdminError(message, error) {
            console.error(error || message);
            alert(message);
        }

        function getTodayString() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, "0");
            const day = String(d.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        function parseTime(timeStr) {
            const [t, modifier] = String(timeStr || "").split(" ");
            let [hours, minutes] = String(t || "0:0").split(":");
            hours = parseInt(hours || "0");
            if (hours === 12 && modifier === "AM") hours = 0;
            if (hours !== 12 && modifier === "PM") hours += 12;
            return hours * 60 + (parseInt(minutes || "0") || 0);
        }

        function formatMoney(amount) {
            return new Intl.NumberFormat("es-AR", {
                style: "currency",
                currency: "ARS",
                maximumFractionDigits: 0
            }).format(amount || 0);
        }

        function getBookingPrice(booking) {
            const service = servicesCache.find((s) => s.name === booking.service_name);
            return Number(service?.price) || 0;
        }

        async function refreshData() {
            [servicesCache, barbersCache, bookingsCache] = await Promise.all([
                DB.getServices(),
                DB.getBarbers(),
                DB.getBookings()
            ]);
        }

        async function checkLogin() {
            if (!sbClient) {
                showAdminError("Falta configurar Supabase. Revisá supabase-config.js", supabaseInitError);
                return;
            }

            const pass = document.getElementById("password").value;
            if (pass !== getAdminPass()) {
                document.getElementById("login-error").style.display = "block";
                return;
            }

            try {
                await refreshData();
                await DB.seedDefaultsIfEmpty();
                await refreshData();
                document.getElementById("screen-login").classList.remove("active");
                document.getElementById("screen-dashboard").classList.add("active");
                closeSettingsPanel();
                await loadAllData();
                startAutoRefresh();
            } catch (error) {
                showAdminError("No se pudo conectar con Supabase. Revisá supabase-config.js.", error);
            }
        }

        async function autoRefreshDashboard() {
            if (isAutoRefreshing) return;
            if (document.hidden) return;
            const dashboard = document.getElementById("screen-dashboard");
            if (!dashboard || !dashboard.classList.contains("active")) return;

            try {
                isAutoRefreshing = true;
                await refreshData();
                await loadAllData();
            } catch (error) {
                console.error("Auto-refresh admin falló:", error);
            } finally {
                isAutoRefreshing = false;
            }
        }

        function startAutoRefresh() {
            if (autoRefreshIntervalId) clearInterval(autoRefreshIntervalId);
            autoRefreshIntervalId = setInterval(autoRefreshDashboard, 10000);
        }

        window.addEventListener("beforeunload", () => {
            if (autoRefreshIntervalId) clearInterval(autoRefreshIntervalId);
        });

        function toggleSettingsPanel() {
            const panel = document.getElementById("admin-settings-panel");
            if (!panel) return;
            panel.classList.toggle("visible");
        }

        function closeSettingsPanel() {
            const panel = document.getElementById("admin-settings-panel");
            if (!panel) return;
            panel.classList.remove("visible");
        }

        function updateAdminPassword() {
            const currentPass = document.getElementById("current-admin-pass").value;
            const newPass = document.getElementById("new-admin-pass").value;
            const confirmPass = document.getElementById("confirm-admin-pass").value;

            if (!currentPass || !newPass || !confirmPass) {
                alert("Completá todos los campos para cambiar la contraseña.");
                return;
            }
            if (currentPass !== getAdminPass()) {
                alert("La contraseña actual no coincide.");
                return;
            }
            if (newPass.length < 6) {
                alert("La nueva contraseña debe tener al menos 6 caracteres.");
                return;
            }
            if (newPass !== confirmPass) {
                alert("La confirmación no coincide con la nueva contraseña.");
                return;
            }

            setAdminPass(newPass);
            alert("Contraseña actualizada correctamente.");

            document.getElementById("current-admin-pass").value = "";
            document.getElementById("new-admin-pass").value = "";
            document.getElementById("confirm-admin-pass").value = "";
            closeSettingsPanel();
        }

        function showTab(tabName) {
            document.querySelectorAll(".tab-content").forEach((c) => { c.style.display = "none"; });
            document.getElementById(`tab-${tabName}`).style.display = "block";
            document.querySelectorAll(".admin-tab-btn").forEach((b) => b.classList.remove("active"));
            if (event && event.target) event.target.classList.add("active");
        }

        async function loadAllData() {
            const dashboardDate = document.getElementById("dashboard-date");
            if (dashboardDate && !dashboardDate.value) {
                const today = getTodayString();
                const nextDateWithBookings = bookingsCache
                    .filter((b) => b.date >= today)
                    .map((b) => b.date)
                    .sort((a, b) => a.localeCompare(b))[0];
                dashboardDate.value = nextDateWithBookings || today;
            }
            populateBarberFilter();
            await Promise.all([loadBookings(), loadHistory(), loadServices(), loadBarbers(), loadReports()]);
        }

        function populateBarberFilter() {
            const select = document.getElementById("dashboard-barber");
            if (!select) return;

            const currentValue = select.value || "all";
            select.innerHTML = '<option value="all">Todos los barberos</option>';
            [...barbersCache]
                .sort((a, b) => a.name.localeCompare(b.name))
                .forEach((barber) => {
                    const option = document.createElement("option");
                    option.value = String(barber.id);
                    option.textContent = barber.name;
                    select.appendChild(option);
                });
            const hasPrevious = [...select.options].some((opt) => opt.value === currentValue);
            select.value = hasPrevious ? currentValue : "all";
        }

        async function loadBookings() {
            const container = document.getElementById("bookings-dashboard");
            const selectedDate = document.getElementById("dashboard-date").value || getTodayString();
            const selectedBarber = document.getElementById("dashboard-barber").value || "all";

            const bookingsByDay = bookingsCache
                .filter((b) => b.date === selectedDate)
                .filter((b) => b.status !== "cancelled")
                .sort((a, b) => parseTime(a.time) - parseTime(b.time));

            const filteredBookings = selectedBarber === "all"
                ? bookingsByDay
                : bookingsByDay.filter((b) => String(b.barber_id) === selectedBarber);

            container.innerHTML = "";
            if (filteredBookings.length === 0) {
                container.innerHTML = '<p style="text-align:center; margin-top:20px;">No hay reservas con ese filtro.</p>';
                return;
            }

            const barbersWithBookings = [];
            filteredBookings.forEach((b) => {
                if (!barbersWithBookings.some((x) => String(x.id) === String(b.barber_id))) {
                    const barberData = barbersCache.find((x) => String(x.id) === String(b.barber_id));
                    barbersWithBookings.push({
                        id: b.barber_id,
                        name: barberData ? barberData.name : (b.barber_name || "Sin barbero")
                    });
                }
            });

            barbersWithBookings.sort((a, b) => a.name.localeCompare(b.name));

            barbersWithBookings.forEach((barber) => {
                const barberCard = document.createElement("div");
                barberCard.className = "barber-day-card";
                const barberBookings = filteredBookings.filter((x) => String(x.barber_id) === String(barber.id));

                barberCard.innerHTML = `
                    <div class="barber-day-header">
                        <span class="barber-day-name"><i class="fa-solid fa-scissors"></i> ${barber.name}</span>
                        <span class="barber-day-count">${barberBookings.length} turno(s)</span>
                    </div>
                `;

                barberBookings.forEach((booking) => {
                    const bookingRow = document.createElement("div");
                    const isDone = booking.completed === true;
                    bookingRow.className = `dashboard-booking-row ${isDone ? "done" : ""}`;
                    bookingRow.innerHTML = `
                        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                            <strong style="font-size:16px;">${booking.time}</strong>
                            <span style="font-size:11px; color:#777;">ID: ${String(booking.id).slice(-4)}</span>
                        </div>
                        <div style="font-size:13px; color:#ddd; margin-bottom:4px;">
                            <i class="fa-solid fa-user"></i> ${booking.client_name || "Sin nombre"}
                        </div>
                        <div style="font-size:12px; color:#aaa; margin-bottom:8px;">
                            <i class="fa-solid fa-phone"></i> ${booking.client_phone || "-"}
                        </div>
                        <div style="font-size:12px; color:var(--accent-red); margin-bottom:10px;">
                            <i class="fa-solid fa-tag"></i> ${booking.service_name}
                        </div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                            <button class="complete-btn" ${isDone ? "disabled" : ""} onclick="markBookingCompleted(${booking.id})">
                                ${isDone ? '<i class="fa-solid fa-check"></i> REALIZADO' : '<i class="fa-solid fa-scissors"></i> MARCAR REALIZADO'}
                            </button>
                            <button class="delete-btn" style="width:100%; padding: 8px;" onclick="deleteBooking(${booking.id})">
                                <i class="fa-solid fa-trash"></i> CANCELAR CITA
                            </button>
                        </div>
                        ${isDone ? '<div style="margin-top:8px;"><span class="done-badge">Corte realizado</span></div>' : ""}
                    `;
                    barberCard.appendChild(bookingRow);
                });
                container.appendChild(barberCard);
            });
        }

        function renderHistoryCard(booking, container) {
            const div = document.createElement("div");
            div.className = "admin-list-item";
            div.style.opacity = "0.7";
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                    <span style="font-size: 18px; color:#999; font-weight:bold;">${booking.time}</span>
                    <span style="color:#666; font-size:12px;">ID: ${String(booking.id).slice(-4)}</span>
                </div>
                <div style="font-weight:bold; margin-bottom:5px; color:#888;">${booking.service_name}</div>
                <div style="background:#222; padding:8px; margin:5px 0; font-size:13px; border-radius:4px; border: 1px solid #333;">
                    <div style="margin-bottom:4px;"><i class="fa-solid fa-user" style="width:20px; text-align:center;"></i> ${booking.client_name || "Sin nombre"}</div>
                    <div><i class="fa-solid fa-phone" style="width:20px; text-align:center;"></i> ${booking.client_phone || "-"}</div>
                </div>
                <div style="font-size:12px; color:#aaa; margin-bottom:10px;">
                    <i class="fa-solid fa-scissors"></i> Barbero: ${booking.barber_name || "Sin barbero"}
                </div>
                ${booking.status === "cancelled" ? '<div style="margin-bottom:10px;"><span class="cancel-badge">Turno cancelado</span></div>' : ""}
                <button class="delete-btn" style="width:100%; padding: 10px; background:#444;" onclick="hardDeleteBooking(${booking.id})">
                    <i class="fa-solid fa-trash"></i> BORRAR REGISTRO
                </button>
            `;
            container.appendChild(div);
        }

        async function loadHistory() {
            const container = document.getElementById("history-list");
            const today = getTodayString();
            const pastBookings = [...bookingsCache]
                .filter((b) => b.date < today || b.status === "cancelled")
                .sort((a, b) => {
                    if (a.date !== b.date) return b.date.localeCompare(a.date);
                    return parseTime(b.time) - parseTime(a.time);
                });

            if (pastBookings.length === 0) {
                container.innerHTML = '<p style="text-align:center; margin-top:20px; color:#666;">El historial está vacío.</p>';
                return;
            }

            container.innerHTML = "";
            let lastDate = null;
            pastBookings.forEach((b) => {
                if (b.date !== lastDate) {
                    const header = document.createElement("div");
                    header.style.cssText = "background: #222; color: #888; padding: 8px 10px; margin: 25px 0 10px 0; border-radius: 4px; font-weight: bold; font-size: 14px; border-left: 4px solid #666;";
                    header.innerText = b.date;
                    container.appendChild(header);
                    lastDate = b.date;
                }
                renderHistoryCard(b, container);
            });
        }

        async function deleteBooking(id) {
            if (!confirm("¿Cancelar esta cita?")) return;
            try {
                await DB.cancelBooking(id);
                await refreshData();
                await Promise.all([loadBookings(), loadHistory(), loadReports()]);
            } catch (error) {
                showAdminError("No se pudo cancelar la reserva.", error);
            }
        }

        async function hardDeleteBooking(id) {
            if (!confirm("¿Borrar registro permanentemente?")) return;
            try {
                await DB.deleteBooking(id);
                await refreshData();
                await Promise.all([loadBookings(), loadHistory(), loadReports()]);
            } catch (error) {
                showAdminError("No se pudo borrar el registro.", error);
            }
        }

        async function markBookingCompleted(id) {
            try {
                await DB.markBookingCompleted(id);
                await refreshData();
                await Promise.all([loadBookings(), loadHistory(), loadReports()]);
            } catch (error) {
                showAdminError("No se pudo marcar el corte como realizado.", error);
            }
        }

        async function loadServices() {
            const container = document.getElementById("services-list");
            container.innerHTML = "";

            servicesCache.forEach((s) => {
                const div = document.createElement("div");
                div.className = "admin-list-item";
                div.innerHTML = `
                    <div style="margin-bottom: 5px; font-weight: bold;">${s.name}</div>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="price-${s.id}" value="${s.price}" class="admin-input" style="width: 90px; margin:0;">
                        <button class="btn btn-secondary" style="padding: 5px 15px; margin:0;" onclick="updatePrice(${s.id})">GUARDAR</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        async function updatePrice(serviceId) {
            try {
                const newPrice = document.getElementById(`price-${serviceId}`).value;
                await DB.updateServicePrice(serviceId, newPrice);
                await refreshData();
                await Promise.all([loadServices(), loadReports()]);
                alert("Precio actualizado");
            } catch (error) {
                showAdminError("No se pudo actualizar el precio.", error);
            }
        }

        async function loadBarbers() {
            const container = document.getElementById("barbers-list");
            container.innerHTML = "";

            barbersCache.forEach((b) => {
                const div = document.createElement("div");
                div.className = "admin-list-item";
                div.style.display = "flex";
                div.style.justifyContent = "space-between";
                div.style.alignItems = "center";
                div.innerHTML = `
                    <span>${b.name}</span>
                    <div style="display:flex; gap:5px;">
                        <button class="btn" style="width:auto; padding:5px 10px; margin:0; border-color:${b.active ? "green" : "gray"}; color:${b.active ? "green" : "gray"};" onclick="toggleBarber(${b.id}, ${b.active})">
                            ${b.active ? "ACTIVO" : "INACTIVO"}
                        </button>
                        <button class="delete-btn" style="padding: 5px 10px;" onclick="deleteBarber(${b.id})">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        async function toggleBarber(id, isActive) {
            try {
                await DB.updateBarber(id, { active: !isActive });
                await refreshData();
                populateBarberFilter();
                await Promise.all([loadBarbers(), loadBookings()]);
            } catch (error) {
                showAdminError("No se pudo cambiar el estado del barbero.", error);
            }
        }

        async function deleteBarber(id) {
            if (!confirm("¿Estás seguro de ELIMINAR a este barbero permanentemente?")) return;
            try {
                await DB.deleteBarber(id);
                await refreshData();
                populateBarberFilter();
                await Promise.all([loadBarbers(), loadBookings()]);
            } catch (error) {
                showAdminError("No se pudo eliminar el barbero.", error);
            }
        }

        async function addBarber() {
            const input = document.getElementById("new-barber");
            const name = input.value.trim();
            if (!name) return;

            try {
                await DB.addBarber(name);
                input.value = "";
                await refreshData();
                populateBarberFilter();
                await Promise.all([loadBarbers(), loadBookings()]);
            } catch (error) {
                showAdminError("No se pudo agregar el barbero.", error);
            }
        }

        async function loadReports() {
            const summaryContainer = document.getElementById("report-summary");
            const byBarberContainer = document.getElementById("report-by-barber-list");
            const cancelledContainer = document.getElementById("report-cancelled-list");
            const today = getTodayString();
            const completedBookings = bookingsCache.filter((b) => b.completed === true && b.date === today && b.status !== "cancelled");
            const cancelledToday = bookingsCache.filter((b) => b.status === "cancelled" && String(b.cancelled_at || "").startsWith(today));
            const cancelledForToday = bookingsCache.filter((b) => b.status === "cancelled" && b.date === today);

            const totalBookings = completedBookings.length;
            const incomeTotal = completedBookings.reduce((acc, b) => acc + getBookingPrice(b), 0);
            const activeBarbersWithBookings = new Set(completedBookings.map((b) => String(b.barber_id))).size;

            summaryContainer.innerHTML = `
                <div class="report-card">
                    <div class="report-card-title">Cortes hoy</div>
                    <div class="report-card-value">${totalBookings}</div>
                </div>
                <div class="report-card">
                    <div class="report-card-title">Dinero hoy</div>
                    <div class="report-card-value">${formatMoney(incomeTotal)}</div>
                </div>
                <div class="report-card">
                    <div class="report-card-title">Barberos con cortes hoy</div>
                    <div class="report-card-value">${activeBarbersWithBookings}</div>
                </div>
                <div class="report-card">
                    <div class="report-card-title">Promedio por corte hoy</div>
                    <div class="report-card-value">${formatMoney(totalBookings ? incomeTotal / totalBookings : 0)}</div>
                </div>
                <div class="report-card">
                    <div class="report-card-title">Cancelados hoy</div>
                    <div class="report-card-value">${cancelledToday.length}</div>
                </div>
                <div class="report-card">
                    <div class="report-card-title">Cancelados para hoy</div>
                    <div class="report-card-value">${cancelledForToday.length}</div>
                </div>
            `;

            const reportByBarber = {};
            completedBookings.forEach((b) => {
                const barberId = String(b.barber_id ?? "unknown");
                if (!reportByBarber[barberId]) {
                    const barberData = barbersCache.find((x) => String(x.id) === barberId);
                    reportByBarber[barberId] = {
                        barberName: barberData ? barberData.name : (b.barber_name || "Sin barbero"),
                        count: 0,
                        income: 0
                    };
                }
                reportByBarber[barberId].count += 1;
                reportByBarber[barberId].income += getBookingPrice(b);
            });

            const barberRows = Object.values(reportByBarber).sort((a, b) => a.barberName.localeCompare(b.barberName));
            if (barberRows.length === 0) {
                byBarberContainer.innerHTML = '<p style="text-align:center; color:#666; margin-top:20px;">Hoy todavía no hay cortes realizados.</p>';
            } else {
                byBarberContainer.innerHTML = "";
                barberRows.forEach((item) => {
                    const row = document.createElement("div");
                    row.className = "report-row";
                    row.innerHTML = `
                        <div>
                            <div class="report-date">${item.barberName}</div>
                            <div class="report-meta">${item.count} corte(s)</div>
                        </div>
                        <div class="report-money">${formatMoney(item.income)}</div>
                    `;
                    byBarberContainer.appendChild(row);
                });
            }

            const cancelledRows = [...cancelledToday].sort((a, b) => {
                const aAt = String(a.cancelled_at || "");
                const bAt = String(b.cancelled_at || "");
                return bAt.localeCompare(aAt);
            });

            if (cancelledRows.length === 0) {
                cancelledContainer.innerHTML = '<div class="report-section-title">Cancelados hoy</div><p style="text-align:center; color:#666; margin-top:8px;">Hoy no hubo cancelaciones.</p>';
                return;
            }

            cancelledContainer.innerHTML = '<div class="report-section-title">Cancelados hoy</div>';
            cancelledRows.forEach((b) => {
                const row = document.createElement("div");
                row.className = "report-row";
                row.innerHTML = `
                    <div>
                        <div class="report-date">${b.client_name || "Cliente"} - ${b.time}</div>
                        <div class="report-meta">${b.date} | ${b.barber_name || "Sin barbero"} | ${b.service_name || "-"}</div>
                    </div>
                    <div class="cancel-badge">Cancelado</div>
                `;
                cancelledContainer.appendChild(row);
            });
        }
        // ── WhatsApp ──────────────────────────────────────────────
        const WA_GH_TOKEN = '__GITHUB_TOKEN__';
        const WA_GH_REPO  = '__GITHUB_REPO__';
        let waPollingInterval = null;

        async function loadWhatsappStatus() {

            try {
                const { data, error } = await requireSupabase()
                    .from('whatsapp_setup')
                    .select('status, qr_code')
                    .eq('id', 1)
                    .single();

                if (error || !data) {
                    document.getElementById('wa-status-badge').innerHTML =
                        '<span style="color:#f59e0b;">⚠️ Tabla no creada en Supabase</span>';
                    return;
                }
                updateWhatsappUI(data.status, data.qr_code);
                if (data.status === 'pending_qr') startWAPolling();
            } catch (e) {
                document.getElementById('wa-status-badge').innerHTML =
                    '<span style="color:#ff4444;">Error al cargar estado</span>';
            }
        }

        function updateWhatsappUI(status, qrCode) {
            const badge       = document.getElementById('wa-status-badge');
            const qrContainer = document.getElementById('wa-qr-container');
            const qrImage     = document.getElementById('wa-qr-image');
            const btn         = document.getElementById('wa-reconnect-btn');

            if (status === 'connected') {
                badge.innerHTML = '<span style="color:#22c55e; font-size:16px;">● WhatsApp conectado</span>';
                qrContainer.style.display = 'none';
                btn.disabled = false;
                btn.textContent = 'VINCULAR / RECONECTAR';
                stopWAPolling();
            } else if (status === 'pending_qr' && qrCode) {
                badge.innerHTML = '<span style="color:#f59e0b; font-size:16px;">⏳ Esperando escaneo...</span>';
                qrContainer.style.display = 'block';
                qrImage.src = qrCode;
            } else {
                badge.innerHTML = '<span style="color:#ef4444; font-size:16px;">● WhatsApp desconectado</span>';
                qrContainer.style.display = 'none';
                btn.disabled = false;
                btn.textContent = 'VINCULAR / RECONECTAR';
            }
        }

        async function reconnectWhatsapp() {
            const token = WA_GH_TOKEN;
            const repo  = WA_GH_REPO;

            if (!token || !repo || token === '__GITHUB_TOKEN__') {
                alert('WhatsApp no está configurado. Contactá al soporte.');
                return;
            }

            const btn = document.getElementById('wa-reconnect-btn');
            btn.disabled = true;
            btn.textContent = 'Iniciando...';

            try {
                await requireSupabase()
                    .from('whatsapp_setup')
                    .upsert({ id: 1, status: 'disconnected', qr_code: null });

                const res = await fetch(
                    `https://api.github.com/repos/${repo}/actions/workflows/setup.yml/dispatches`,
                    {
                        method: 'POST',
                        headers: {
                            Authorization: `Bearer ${token}`,
                            'Content-Type': 'application/json',
                            Accept: 'application/vnd.github+json'
                        },
                        body: JSON.stringify({ ref: 'main' })
                    }
                );

                if (!res.ok) throw new Error(`GitHub: ${res.status}`);

                btn.textContent = 'Generando QR...';
                startWAPolling();
            } catch (e) {
                alert('Error: ' + e.message);
                btn.disabled = false;
                btn.textContent = 'VINCULAR / RECONECTAR';
            }
        }

        function startWAPolling() {
            stopWAPolling();
            waPollingInterval = setInterval(async () => {
                const { data } = await requireSupabase()
                    .from('whatsapp_setup')
                    .select('status, qr_code')
                    .eq('id', 1)
                    .single();
                if (data) updateWhatsappUI(data.status, data.qr_code);
            }, 2500);
        }

        function stopWAPolling() {
            if (waPollingInterval) { clearInterval(waPollingInterval); waPollingInterval = null; }
        }
    </script>
</body>
</html>
