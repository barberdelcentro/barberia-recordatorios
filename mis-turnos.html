<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis turnos - Barber Shop</title>
    <link rel="stylesheet" href="styles.css?v=20260308-1">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js?v=fix-cb-001"></script>
</head>
<body>
    <div class="phone-container">
        <div class="corner-decoration corner-tl"></div>
        <div class="corner-decoration corner-tr"></div>
        <div class="corner-decoration corner-bl"></div>
        <div class="corner-decoration corner-br"></div>

        <div class="screen-content">
            <div class="screen active home-screen">
                <div class="home-overlay"></div>
                <div class="cancel-wrapper my-turns-wrapper" style="position:relative; z-index:2;">
                    <div class="cancel-card my-turns-card">
                        <h2>Mis turnos</h2>
                        <p class="cancel-message">Ingresá tu celular para ver y cancelar turnos pendientes.</p>

                        <input id="my-turns-phone" class="form-input" type="tel" placeholder="Ej: 11 1234 5678">
                        <button id="my-turns-search-btn" class="btn btn-primary">Buscar turnos</button>

                        <div id="my-turns-result" class="my-turns-result">
                            <p class="my-turns-empty">Todavía no buscaste turnos.</p>
                        </div>

                        <a href="index.html" class="btn btn-secondary">Volver al inicio</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="mis-turnos.js?v=2"></script>
</body>
</html>
